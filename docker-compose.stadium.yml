services:
  toffeecon-core:
    build:
      context: .
    ports:
      - "5000:5000"
    volumes:
      - ./server/data:/app/server/data
      - ./client/public/assets:/app/client/public/assets
    environment:
      - PORT=5000
      - NODE_ENV=production
      - OFFLINE_STADIUM_MODE=true
    restart: always
