<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Personal Dashboard · This or That Live Vote · ToffeeCon 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070312;
            --purple: #A855F7;
            --magenta: #B80088;
            --pink: #EC4899;
            --cyan: #00F0FF;
            --orange: #FF6B00;
            --emerald: #10B981;
            --text-main: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 15%, rgba(168, 85, 247, 0.3) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        header {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.35);
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            color: #D8B4FE;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .brand-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFF 20%, #D8B4FE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: #94A3B8;
            margin-top: 4px;
        }

        /* Main Voting Card Area */
        .vote-card-container {
            position: relative;
            z-index: 10;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        .round-indicator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.78rem;
            color: #94A3B8;
            padding: 0 4px;
        }

        .choice-btn {
            position: relative;
            background: rgba(15, 10, 30, 0.9);
            border: 2.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            padding: 26px 22px;
            text-align: left;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .choice-btn:active {
            transform: scale(0.97);
        }

        .choice-btn.selected {
            border-color: #FFF !important;
            box-shadow: 0 0 35px currentColor !important;
        }

        .choice-content {
            position: relative;
            z-index: 2;
        }

        .choice-badge {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .choice-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .choice-icon {
            font-size: 2.8rem;
            position: relative;
            z-index: 2;
            transition: transform 0.2s;
        }

        .choice-btn:active .choice-icon {
            transform: scale(1.15);
        }

        /* Live room percentage bar inside button */
        .choice-progress-bg {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            background: currentColor;
            opacity: 0.18;
            transition: width 0.35s ease;
            z-index: 1;
        }

        .choice-pct-tag {
            font-family: 'Space Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            position: relative;
            z-index: 2;
            margin-left: 12px;
        }

        /* VS Separator */
        .vs-divider-box {
            text-align: center;
            position: relative;
            margin: -6px 0;
        }

        .vs-pill {
            display: inline-block;
            background: #0B061A;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #CBD5E1;
            padding: 3px 14px;
            border-radius: 20px;
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
        }

        /* Confirmation Toast */
        .vote-status-card {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 14px;
            padding: 12px 16px;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: #10B981;
            display: none;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-top: 20px;
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            color: #64748B;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <header>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <a href="/portal" style="color:var(--text-dim, #94A3B8); text-decoration:none; font-family:'Space Mono'; font-size:0.75rem; display:flex; align-items:center; gap:4px;">
                <span>← Companion</span>
            </a>
            <img src="/assets/toffeecon-logo.png" alt="ToffeeCon" style="height:28px; filter:drop-shadow(0 0 14px rgba(184,0,136,0.5));">
            <a href="/vote" style="color:var(--pink); text-decoration:none; font-family:'Space Mono'; font-size:0.75rem; border:1px solid rgba(236,72,153,0.3); padding:3px 8px; border-radius:12px;">
                Sonic Vote ↗
            </a>
        </div>
        <div class="brand-badge">
            <span>●</span> TOFFEECON 2026 · PERSONAL DASHBOARD
        </div>
        <h1 class="brand-title">This or That?</h1>
        <p class="brand-subtitle">Cast your vote to shape Toffee's big-screen catalog</p>
    </header>

    <div class="vote-card-container">
        <div class="round-indicator">
            <span id="labelRoundCategory">ROUND 1/3: DRAMA OR ROMANCE?</span>
            <span id="labelRoomVotes">200 Votes</span>
        </div>

        <!-- Option A Card -->
        <button class="choice-btn" id="btnOptionA" onclick="castOptionVote('A')">
            <div class="choice-progress-bg" id="bgProgressA" style="width: 70%; color: #A855F7;"></div>
            <div class="choice-content">
                <div class="choice-badge" id="badgeA" style="color: #A855F7;">
                    <span>OPTION A</span>
                </div>
                <div class="choice-title" id="titleOptionA">DRAMA</div>
            </div>
            <div style="display:flex; align-items:center;">
                <div class="choice-pct-tag" id="pctTagA" style="color: #A855F7;">70%</div>
                <div class="choice-icon" id="iconOptionA">🎭</div>
            </div>
        </button>

        <div class="vs-divider-box">
            <span class="vs-pill">⚡ VS ⚡</span>
        </div>

        <!-- Option B Card -->
        <button class="choice-btn" id="btnOptionB" onclick="castOptionVote('B')">
            <div class="choice-progress-bg" id="bgProgressB" style="width: 30%; color: #EC4899;"></div>
            <div class="choice-content">
                <div class="choice-badge" id="badgeB" style="color: #EC4899;">
                    <span>OPTION B</span>
                </div>
                <div class="choice-title" id="titleOptionB">ROMANCE</div>
            </div>
            <div style="display:flex; align-items:center;">
                <div class="choice-pct-tag" id="pctTagB" style="color: #EC4899;">30%</div>
                <div class="choice-icon" id="iconOptionB">💖</div>
            </div>
        </button>

        <div class="vote-status-card" id="statusCard">
            ✓ Balloted! Real-time stage gauges updated.
        </div>
    </div>

    <footer>
        <div>CONNECTED TO VENUE LOCAL MESH</div>
        <div style="margin-top:4px; color:#A855F7;">TOFFEECON EOS · STAGE OF TOMORROW</div>
    </footer>

    <script>
        const attendeeId = 'attendee_' + Math.floor(1000 + Math.random() * 9000);
        let currentRound = null;
        let userSelected = null;

        // WebSocket Connection
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.type === 'INIT_STATE') {
                    if (msg.data.personalDashboard) updateUI(msg.data.personalDashboard);
                } else if (msg.type === 'DASHBOARD_UPDATE') {
                    updateUI(msg.data);
                }
            } catch (e) {}
        };

        function updateUI(data) {
            if (!data || !data.round) return;
            const r = data.round;
            currentRound = r;

            document.getElementById('labelRoundCategory').textContent = 
                `ROUND ${data.currentRoundIndex + 1}/3: ${r.category.toUpperCase()}`;
            document.getElementById('labelRoomVotes').textContent = `${r.totalVotes} Votes`;

            // Option A
            document.getElementById('titleOptionA').textContent = r.optionA.label;
            document.getElementById('iconOptionA').textContent = r.optionA.icon;
            document.getElementById('pctTagA').textContent = `${r.pctA}%`;
            document.getElementById('pctTagA').style.color = r.optionA.color;
            document.getElementById('badgeA').style.color = r.optionA.color;
            document.getElementById('bgProgressA').style.width = `${r.pctA}%`;
            document.getElementById('bgProgressA').style.color = r.optionA.color;
            document.getElementById('btnOptionA').style.borderColor = r.optionA.color + '44';

            // Option B
            document.getElementById('titleOptionB').textContent = r.optionB.label;
            document.getElementById('iconOptionB').textContent = r.optionB.icon;
            document.getElementById('pctTagB').textContent = `${r.pctB}%`;
            document.getElementById('pctTagB').style.color = r.optionB.color;
            document.getElementById('badgeB').style.color = r.optionB.color;
            document.getElementById('bgProgressB').style.width = `${r.pctB}%`;
            document.getElementById('bgProgressB').style.color = r.optionB.color;
            document.getElementById('btnOptionB').style.borderColor = r.optionB.color + '44';

            // Lock state
            if (data.status === 'locked' || data.status === 'showcase') {
                document.getElementById('btnOptionA').disabled = true;
                document.getElementById('btnOptionB').disabled = true;
                const status = document.getElementById('statusCard');
                status.style.display = 'block';
                status.style.borderColor = '#F59E0B';
                status.style.color = '#F59E0B';
                status.textContent = '🔒 Voting Locked for this round. Look up at the Stage!';
            } else {
                document.getElementById('btnOptionA').disabled = false;
                document.getElementById('btnOptionB').disabled = false;
            }
        }

        async function castOptionVote(optionChoice) {
            userSelected = optionChoice;
            document.getElementById('btnOptionA').classList.toggle('selected', optionChoice === 'A');
            document.getElementById('btnOptionB').classList.toggle('selected', optionChoice === 'B');

            // Haptic trigger if supported
            if (window.navigator.vibrate) window.navigator.vibrate(40);

            try {
                const res = await fetch('/api/dashboard/vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        option: optionChoice,
                        attendeeId: attendeeId
                    })
                });
                const data = await res.json();
                if (data.success) {
                    const status = document.getElementById('statusCard');
                    status.style.display = 'block';
                    status.style.borderColor = 'rgba(16, 185, 129, 0.4)';
                    status.style.color = '#10B981';
                    status.textContent = '✓ Balloted! Real-time stage gauges updated.';
                }
            } catch (e) {}
        }

        // Initial fetch
        fetch('/api/dashboard/state').then(r => r.json()).then(data => updateUI(data));
    </script>
</body>
</html>
